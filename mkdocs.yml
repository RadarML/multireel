site_name: Multireel
site_url: https://radarml.github.io/multireel
repo_url: https://github.com/RadarML/multireel
repo_name: RadarML/multireel
# The python_xref handler's `paths` is not watched automatically.
watch: [src]
nav:
  - Home: index.md
  - Bundle Spec: spec.md
  - Bundle Player: player.md
  - API:
    - multireel: api/multireel.md
    - multireel.render: api/render.md
    - multireel.progress: api/progress.md

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  variant: classic
  icon:
    logo: material/filmstrip
    annotation: material/arrow-right-circle
  font:
    code: monospace
  features:
    - navigation.instant
    - navigation.expand
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: blue
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: teal
    accent: blue
    toggle:
      icon: material/weather-night
      name: Switch to system preference

plugins:
- search
- autorefs
- llmstxt:
    full_output: llms-full.txt
    markdown_description: |
      `multireel` is a python library implementing a multimodal rendering
      framework for video editing.
    sections:
      "Multireel":
      - index.md: Project overview and installation
      - spec.md: Bundle file format spec
      - player.md: Web player for watching bundles in a browser
      "Development":
      - api/multireel.md: Core API for writing bundles, and the bundle format types
      - api/render.md: Rendering arrays into RGB frames
      - api/progress.md: Rich progress bars for writing bundles
- mkdocstrings:
    default_handler: python_xref
    handlers:
      python_xref:
        paths: [src]
        options:
          docstring_style: google
          relative_crossrefs: true
          separate_signature: true
          line_length: 80
          show_signature_annotations: true
          signature_crossrefs: true
          show_root_full_path: true
          show_root_members_full_path: true
          show_symbol_type_heading: true
          show_root_heading: true
          show_root_toc_entry: true
          heading_level: 1
          members_order: source
          # Hide private names and dunder methods; class docstrings say what
          # callers need to know about the latter.
          filters: ["!^_"]
          check_crossrefs_exclude:
          - "^numpy\\.(.*)"
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://numpy.org/doc/stable/objects.inv
        - https://radarml.github.io/abstract-dataloader/objects.inv

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
